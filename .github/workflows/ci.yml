name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check the tag is a v0 or v1 semver
        if: github.ref_type == 'tag'
        run: '[[ "$GITHUB_REF_NAME" =~ ^v[01]\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]'
      - run: go vet ./... && go vet -tags e2e ./e2e
      - run: go test ./...

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.33.0
      - run: docker build -t kglance:dev .
      - run: hack/e2e-kind.sh
        env:
          IMAGE: kglance:dev

  image:
    runs-on: ubuntu-latest
    needs: [test, e2e]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/rosenhouse-bot-sandbox/kglance
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_type == 'tag' && github.ref_name || '' }}

  binaries:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: hack/build-release.sh "$VERSION" dist
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.0.0-ci' }}
      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: binaries
          path: dist/

  release:
    runs-on: ubuntu-latest
    needs: [image, binaries]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist
      - name: Check the released image reports this version
        run: |
          image=ghcr.io/rosenhouse-bot-sandbox/kglance:$GITHUB_REF_NAME
          got=$(docker run --rm "$image" version)
          [[ "$got" == "kglance $GITHUB_REF_NAME"$'\n'"collector image $image" ]] || { echo "image reports \"$got\""; exit 1; }
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes $PRERELEASE dist/*
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
