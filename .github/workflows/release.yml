name: release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Tag to create on main, e.g. v0.1.0
        required: true

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check this runs on main
        run: '[[ "$GITHUB_REF" == refs/heads/main ]]'
      - name: Check the version is a v0 or v1 semver
        run: '[[ "$VERSION" =~ ^v[01]\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]'
        env:
          VERSION: ${{ inputs.version }}
      - run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$VERSION" -f sha="$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
      # Tags created with GITHUB_TOKEN trigger no workflows, so start ci explicitly.
      - run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "refs/tags/$VERSION"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
